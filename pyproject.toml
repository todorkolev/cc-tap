[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cc-tap"
dynamic = ["version"]
description = "MCP server that bridges Claude Desktop to Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Enrico Santagati" }]
keywords = ["mcp", "claude", "claude-code", "ai", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0",
    "requests>=2.31",
]

[project.scripts]
cc_tap = "cc_tap.server:main"

[project.urls]
Homepage = "https://github.com/es617/cc-tap"
Repository = "https://github.com/es617/cc-tap"
Issues = "https://github.com/es617/cc-tap/issues"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
dev = ["pre-commit>=4.0", "ruff>=0.9"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "cc_tap/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cc_tap"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S603", "S607", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "RUF059"]
"scripts/*" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["cc_tap"]
